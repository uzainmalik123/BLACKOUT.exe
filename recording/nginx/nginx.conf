# The shop's front door. Two access logs of the same requests:
#   access.log   the real `combined` format a defender would read
#   access.jsonl the same fields plus millisecond time, for the converter (D-15)
worker_processes 1;
events { worker_connections 256; }

http {
  log_format rec escape=json '{"msec":"$msec","ip":"$remote_addr","method":"$request_method","target":"$request_uri","protocol":"$server_protocol","status":$status,"bytes":$body_bytes_sent,"referer":"$http_referer","ua":"$http_user_agent","rt":"$request_time"}';
  access_log /var/log/rec/access.log combined;
  access_log /var/log/rec/access.jsonl rec;
  error_log /var/log/rec/error.log warn;

  # The rig has one attacker box; a move that comes from many addresses (MIN-02's swarm) names each
  # one in X-Forwarded-For, trusted from the tools container only (D-27). Without the header the
  # client is the tools container itself, as before.
  set_real_ip_from 10.66.0.66;
  real_ip_header X-Forwarded-For;

  server {
    listen 80;
    location / {
      proxy_pass http://10.66.0.20:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }
  }
}
